# Full-training-set regime: train/val are every case of the log that is not a fixed-set
# test case; test stays the fixed sets' own test cases at their own prefix lengths.
# The partition and the per-case targets come from fixed_split_file; the ratio below is
# present only for compatibility and is ignored.
dataset_name: Bpi12w.xes
event_attributes: ['prev_resource']
event_num_att: ['open_cases', 'busyness', 'ent_act', 'ent_case', 'res_work_items', 'res_unique_tasks']
case_attributes: []
case_num_att: ['AMOUNT_REQ']
train_val_test_ratio: [0.64, 0.16, 0.2]
target_normalization: True
target_variable: total_time
fixed_split_file: /home/padela/Scrivania/PGTNet/fts5050_splits/bpi12w.json
